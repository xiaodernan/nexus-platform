# NEXUS D898 (Phase G / G5) — machine-readable census of the cloud plane's claims.
#
# docs/CLOUD.md stays the human-facing page. THIS file is the machine-readable index that
# scripts/check_cloud_claims.mjs judges. Every behaviour claim must name four things at once:
#   claim          what is asserted
#   smoke          the live proof (comma-separated when one claim has several)
#   gate           the always-runnable wiring reader
#   not_claimed    the boundary that stops the claim from being read as more than it is
#   honesty_anchor an EXACT phrase in CLOUD.md's "What this plane does NOT claim" section
# falsifier is optional ("none" when the claim has no absence/no-drive/no-peer arm).
#
# Grammar is deliberately RESTRICTED so the reader needs no YAML dependency: one "- id:" line
# starts a record, two-space "key: value" lines extend it, values are plain single-line scalars
# with no colon-space, no quote and no '#'. A line that breaks the grammar reddens the gate.
# The reader also runs a REVERSE census: every check_*.mjs and every cloud *.sh named in CLOUD.md
# must appear here, so the prose page cannot quietly gain a proof the census does not know about.

- id: D848
