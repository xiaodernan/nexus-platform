# NEXUS — gitleaks configuration.
#
# The default scanner, run with no config, reports exactly these three as findings on a clean
# repository (CI run #2 on 14d8ba0):
#
#   1. data/seed/falsifier_plants.py — this file exists to carry adversarial look-alike
#      "password and key" payloads. It is a falsifier fixture, documented as synthetic in its own
#      banner, and the security readers depend on those fixtures being present and unmodified.
#      Exempting this one path, wholesale.
#   2. docs/STATUS.md — the repo's append-only ledger. The generic-api-key entropy heuristic
#      fires on token runs inside prose sentences (an environment-variable spelling in a sentence
#      reads as an "api key" to entropy). This exemption is scoped to that ONE rule in THAT ONE
#      path: every other finding, and this rule anywhere else, still fails the build.
#
# Anything else stays in scope. If either of these ever hides a real finding, that is a bug in this
# file, and the `check_falsifier_registry`/security ledger units are the way to close it.

title = "nexus .gitleaks.toml"

[allowlist]
description = "synthetic falsifier fixtures (accidentally-resembling secrets by design)"
paths = [
  '''data/seed/falsifier_plants.py''',
]

[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  description = "docs/STATUS.md is append-only documentation prose; entropy matches words in sentences, not secrets"
  paths = [
    '''docs/STATUS.md''',
  ]
