# Local development profile. These are throwaway localhost *addresses*, not secrets — never reuse this
# file outside localhost, and never put credentials in it (they live in the root `.env`, which is not
# tracked — §131). The previous default here pointed at :5432, which on this machine is another
# project's Postgres (D9); connecting a dev profile to a database nobody here owns is how a test
# migration ends up running against someone else's data, so the port is pinned to the nexus container
# and the password is deliberately left unset so the service fails closed instead of guessing.
spring:
  datasource:
    # The same variable chain as the base file, so the launcher's NEXUS_PLATFORM_DB_* exports are the
    # values the dev profile actually reads. They were not: this block looked only at NEXUS_DB_URL, so
    # `NEXUS_PLATFORM_DB_URL=… scripts/run_platform_dev.sh` silently kept hitting the default database.
    url: ${NEXUS_PLATFORM_DB_URL:${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5433/nexus}}
    username: ${NEXUS_PLATFORM_DB_USERNAME:${NEXUS_DB_USER:nexus_app}}
    password: ${NEXUS_PLATFORM_DB_PASSWORD:${NEXUS_DB_PASSWORD:}}
  flyway:
    # Migrations run as the infra superuser, not as the runtime role. `00_roles.sql` gives `nexus_app`
    # DML and nothing else, so a pending table-level migration aborts the boot with
    # `42501 must be owner of table …` — which is exactly how V4 first landed. (V3 survived only because
    # db_apply_migrations.sh transfers *view* ownership to the app role.) Same split as compose below.
    url: ${NEXUS_MIGRATION_DB_URL:${NEXUS_PLATFORM_DB_URL:${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5433/nexus}}}
    user: ${NEXUS_MIGRATION_DB_USER:postgres}
    # D992 — a fresh CI checkout has NO root `.env`, so neither NEXUS_MIGRATION_DB_PASSWORD nor
    # NEXUS_DB_ROOT_PASSWORD is set; the old chain therefore yielded an EMPTY password. Flyway runs
    # as the `postgres` superuser (above) against the scram-sha-256 service container, so an empty
    # password is fatal — "The server requested SCRAM-based authentication, but the password is an
    # empty string" kills flywayInitializer, Tomcat never binds :8091, and the lb smoke waits in
    # vain (D989 kept widening the boot budget; a crashed context never answers health however long
    # you wait). Fall through to the runtime datasource password LAST: on dev/CI both roles are the
    # SAME `postgres` user (NEXUS_DB_USER=postgres, NEXUS_DB_PASSWORD=ci_secret), so the one secret
    # the caller already supplied is correct for both. The last two terms MIRROR the runtime
    # datasource password's own chain (application.yml:31): whichever name the caller set —
    # NEXUS_PLATFORM_DB_PASSWORD (the launcher) or NEXUS_DB_PASSWORD (CI's service-container job) —
    # Flyway lands on the same value the app's DataSource does, so they can never drift apart.
    # A split-role production deployment still sets NEXUS_MIGRATION_DB_PASSWORD explicitly and none
    # of these fallbacks are consulted. The value is never printed here; it travels only through the
    # environment into Flyway's own JDBC connection.
    password: ${NEXUS_MIGRATION_DB_PASSWORD:${NEXUS_DB_ROOT_PASSWORD:${NEXUS_PLATFORM_DB_PASSWORD:${NEXUS_DB_PASSWORD:}}}}

nexus:
  redis:
    url: ${NEXUS_REDIS_URL:redis://127.0.0.1:6380/0}
  jwt:
    secret: ${NEXUS_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
  demo:
    # The same offer the base file makes, kept open: this line said `true` outright, which overruled
    # NEXUS_DEMO_LOGIN=false on exactly the profile a local boot uses (run_platform_dev.sh defaults both to
    # dev and :8090), so the one way to turn §87's passwordless demo sessions off could not be taken here (D48).
    login-enabled: ${NEXUS_DEMO_LOGIN:true}
  ratelimit:
    # Kept on in dev but generous, so manual curl sessions do not get throttled. Generous, not fixed: the base
    # file backs these same leaves with NEXUS_RL_*, and a bare literal here silently wins over that offer, so
    # `NEXUS_RL_AUTH=3` on a dev boot did nothing at all (D47 found this by asking a live dev instance for its
    # window and being told 100 when application.yml advertises 10). Same values, now overridable.
    auth-requests: ${NEXUS_RL_AUTH:100}
    write-requests: ${NEXUS_RL_WRITE:300}
    ai-requests: ${NEXUS_RL_AI:100}
logging:
  level:
    com.nexus: DEBUG
