server:
  # D885: the fifth host coordinate on the plane, measured FREE on this dev machine before it was
  # declared (see docs/CLOUD.md's port map). It is NOT one of the three coordinates
  # scripts/check_cloud_plane_ports.mjs owns; scripts/check_cloud_insight.mjs probes it instead.
  port: ${NEXUS_INSIGHT_PORT:19555}

spring:
  application:
    name: nexus-insight
  config:
    # D889: optional on purpose, exactly like the edge. When the Config Server is up this service
    # resolves `nexus.insight.label` from config-repo/nexus-insight.yml; when it is down the local
    # default ("local") keeps the observer bootable and the /insight/config view honest about it.
    import: optional:configserver:${NEXUS_CONFIG_URI:http://127.0.0.1:18888}
  cloud:
    openfeign:
      circuitbreaker:
        # Without a CircuitBreakerFactory on the classpath Feign's `fallback=` is dead config;
        # spring-cloud-starter-circuitbreaker-resilience4j supplies the servlet implementation.
        enabled: true
      client:
        config:
          default:
            # Short on purpose: a name with no instance must reach the fallback promptly, not hang
            # the aggregated view. This is a read-only observer, not a retrying writer.
            connectTimeout: 1500
            readTimeout: 2500
    loadbalancer:
      retry:
        enabled: false

# Older OpenFeign releases read `feign.circuitbreaker.enabled`; keeping both spellings means the
# fallback fires whichever property this BOM resolves. Neither is a claim about production tuning.
feign:
  circuitbreaker:
    enabled: true

eureka:
  client:
    # Default ON: this service is a registry member. `insight_smoke.sh` boots it with this flag
    # false so the fallback path can be proven with no registry running at all.
    enabled: ${NEXUS_INSIGHT_EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${NEXUS_EUREKA_URI:http://127.0.0.1:18761/eureka/}
    register-with-eureka: ${NEXUS_INSIGHT_EUREKA_ENABLED:true}
    fetch-registry: ${NEXUS_INSIGHT_EUREKA_ENABLED:true}
  instance:
    # The plane's standing rule (docs/CLOUD.md): same instance-id shape and lease as every member.
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
    # D899: OpenFeign names its breakers <ClientClass><method> — `PlatformHealthClienthealth`
    # and `AiHealthClienthealth` (measured on /actuator/circuitbreakers by D895). D885 declared
    # the instances under the REGISTRY names, so those two were NEVER used and every Feign breaker
    # silently ran on configs.default. Declaring the REAL names is what makes a per-instance
    # threshold reach the breaker that actually opens. The two DIFFERENT minimumNumberOfCalls
    # values are deliberate: scripts/insight_breaker_config_smoke.sh drives exactly 1..5 calls
    # and requires AI to open on call 3 and platform on call 5, so a config edit that only looks
    # right cannot pass. failureRateThreshold is different per instance too, and is visible on
    # the actuator for the SAME names — proof that the tuning reached the live breakers.
    instances:
      PlatformHealthClienthealth:
        baseConfig: default
        minimumNumberOfCalls: 5
        failureRateThreshold: 60
      AiHealthClienthealth:
        baseConfig: default
        minimumNumberOfCalls: 3
        failureRateThreshold: 40

management:
  endpoints:
    web:
      exposure:
        # D889: `refresh` is the endpoint the hot-refresh smoke POSTs. It is NOT exposed by default;
        # without this entry the config-repo round trip is decoration that cannot be demonstrated.
        # D895: `circuitbreakers` exposes resilience4j's REAL state, so a unit can prove a breaker
        # actually OPENED instead of inferring it from a fallback answer. An answer that says
        # `unavailable` is honest either way; only the actuator says which mechanism produced it.
        include: health,info,metrics,refresh,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

nexus:
  insight:
    # D1025: this member joins the Bus-lite lane (D1024). Opt-in via NEXUS_INSIGHT_BUS_ENABLED;
    # default OFF — this observer never publishes or subscribes unless an operator arms it.
    # The bus reads NEXUS_REDIS_URL (the plane's Redis coordinate), the same knob the smokes use.
    bus:
      enabled: ${NEXUS_INSIGHT_BUS_ENABLED:false}

logging:
  level:
    com.nexus.cloud.insight: INFO
