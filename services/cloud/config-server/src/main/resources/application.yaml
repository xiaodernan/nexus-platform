server:
  port: ${NEXUS_CONFIG_PORT:8888}

spring:
  application:
    name: nexus-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.config: INFO
