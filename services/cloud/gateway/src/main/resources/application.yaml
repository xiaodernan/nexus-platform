server:
  # D847: the host face of the cloud plane is 18761/18888/18088. See eureka-server's application.yaml
  # for why the canonical block is not safe here; the three numbers move together or R3/R4 of
  # scripts/check_cloud_plane_ports.mjs reddens.
  port: ${NEXUS_GATEWAY_PORT:18088}

spring:
  application:
    name: nexus-gateway
  config:
    # Optional on purpose: the edge must serve traffic when the config server is down, and the smoke
    # run asserts the label changes when it is up. Fail-fast belongs to production overlays, not here.
    import: optional:configserver:${NEXUS_CONFIG_URI:http://127.0.0.1:18888}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # D850: X-Request-Id is minted at the edge and echoed by the platform, so both hops add
            # one; RETAIN_UNIQUE keeps a single copy for the caller instead of two identical headers.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials X-Request-Id, RETAIN_UNIQUE
          routes:
            - id: platform
              # D848: env override still wins; without it the cloud profile's nexus.edge.platform-uri
              # (lb://NEXUS-PLATFORM, below) decides, and the base default stays the documented port.
              uri: ${NEXUS_PLATFORM_URI:${nexus.edge.platform-uri:http://127.0.0.1:8090}}
              predicates:
                - Path=/api/v1/**
              filters:
                - name: CircuitBreaker
                  args: { name: platform, fallbackUri: forward:/fallback/platform }
                # D875 (§875): idempotent GETs get exactly two retries BEFORE the breaker judg­es —
                # transient 5xx upstreams recover in place. POST/PATCH/DELETE are never retried.
                - name: Retry
                  args:
                    retries: 2
                    statuses: [INTERNAL_SERVER_ERROR, BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
                    methods: [GET]
            - id: ai
              # D856: the AI route resolves by name under the cloud profile (lb://NEXUS-AI),
              # same shape as the platform route: env override wins, then the profile's
              # nexus.edge.ai-uri, then the documented port.
              uri: ${NEXUS_AI_URI:${nexus.edge.ai-uri:http://127.0.0.1:8010}}
              predicates:
                - Path=/ai/v1/**
              filters:
                - name: CircuitBreaker
                  args: { name: ai, fallbackUri: forward:/fallback/ai }
                - name: Retry
                  args:
                    retries: 2
                    statuses: [INTERNAL_SERVER_ERROR, BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
                    methods: [GET]
            - id: web
              uri: ${NEXUS_WEB_URI:http://127.0.0.1:3000}
              predicates:
                - Path=/**
              filters:
                - name: CircuitBreaker
                  args: { name: web, fallbackUri: forward:/fallback/web }
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${NEXUS_CORS_ORIGINS:http://localhost:3000}
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

# D850: the edge's rate limit and its circuit breakers. The limiter is per client address, per
# gateway process (see EdgeRateLimitFilter's javadoc and DECISIONS D850); the breakers trip after
# 5 calls in a window of 10 with a 50% failure rate and stay open for 10s before a half-open probe.
nexus:
  edge:
    rate-limit-burst: ${NEXUS_GATEWAY_RATE_BURST:10}
    rate-limit-replenish: ${NEXUS_GATEWAY_RATE_REPLENISH:5}

resilience4j:
  circuitbreaker:
    instances:
      platform:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ai:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      web:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

eureka:
  client:
    service-url:
      defaultZone: ${NEXUS_EUREKA_URI:http://127.0.0.1:18761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        # D857: refresh is exposed so config changes land without a restart (the refresh smoke
        # POSTs /actuator/refresh after rewriting the served file).
        include: health,info,gateway,refresh
  endpoint:
    gateway:
      access: unrestricted
    health:
      probes:
        enabled: true
      # D850: show-details on this dev edge exposes breaker state (already health-only exposure);
      # the smoke asserts the platform breaker reports OPEN after a burst of failed upstream calls.
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    # D850: DEBUG flips the breaker's state-transition lines on (the smoke sets NEXUS_CB_LOG=DEBUG
    # and greps for the CLOSED->OPEN transition on the dead-port fixture); INFO stays the default.
    io.github.resilience4j.circuitbreaker: ${NEXUS_CB_LOG:INFO}

---
# D848: with the `cloud` profile the platform route resolves BY NAME through the registry instead of
# a hardcoded address. Only the one property moves — the routes list stays single, so the AI/web
# routes cannot drift into a second copy. The name is the platform's spring.application.name
# uppercased; scripts/check_cloud_discovery.mjs R4 compares the two and reddens on a rename.
spring:
  config:
    activate:
      on-profile: cloud
nexus:
  edge:
    platform-uri: lb://NEXUS-PLATFORM
    ai-uri: lb://NEXUS-AI
