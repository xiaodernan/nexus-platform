server:
  # D847: 18761, not the canonical 8761. On the machine this plane was measured on, :8761 is held by
  # another checkout's registry (services/nexus-registry, a path this repo does not have) listing
  # FOOTBALL-CORE and NEXUS-API. A registry is not a port you can share: the edge would register into
  # somebody else's topology and discover services nobody here owns. Same reasoning as D9's 5433/6380.
  # The container keeps 8761 internally (compose sets NEXUS_EUREKA_PORT); only the host face moves.
  port: ${NEXUS_EUREKA_PORT:18761}

spring:
  application:
    name: nexus-eureka

eureka:
  instance:
    hostname: ${NEXUS_EUREKA_HOST:127.0.0.1}
    # D858: two nodes run the SAME artifact — the default instance-id would make them collide.
    instance-id: ${spring.application.name}:${server.port}
  client:
    # D858: single-node dev registry by default; the HA pair sets NEXUS_EUREKA_PEER=true and a
    # comma-separated NEXUS_EUREKA_ZONE listing both nodes, and the same jar becomes a peer.
    register-with-eureka: ${NEXUS_EUREKA_PEER:false}
    fetch-registry: ${NEXUS_EUREKA_PEER:false}
    service-url:
      defaultZone: ${NEXUS_EUREKA_ZONE:http://${eureka.instance.hostname}:${server.port}/eureka/}
  server:
    # A local/dev registry must reflect reality: a killed gateway should disappear quickly instead
    # of being kept alive by self-preservation.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
