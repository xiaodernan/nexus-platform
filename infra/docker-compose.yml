# NEXUS infrastructure — Phase 1
#
# Contract refs: docs/DECISIONS.md D1/D3, docs/API_CONTRACT.md §0 (role split + ports).
#
# TWO EXECUTION PATHS (deliberate):
#   1. DEFAULT (works today):   docker compose -f infra/docker-compose.yml --env-file .env up -d postgres redis
#      -> only the two containerized data stores start. platform / ai / web run as HOST PROCESSES in Phase 1
#         (see docs/DEPLOYMENT.md §2) because their source trees are being authored concurrently and have no
#         Dockerfile yet.
#   2. FULL (needs Dockerfiles): docker compose --profile full up --build
#      -> additionally builds services/platform/Dockerfile, apps/ai/Dockerfile, apps/web/Dockerfile.
#         Those three files do NOT exist in the repository yet; until they do, `--profile full` fails at build
#         with "failed to read dockerfile". Expected and tracked: docs/DEPLOYMENT.md §3 + §8,
#         docs/ENVIRONMENT_REPORT.md §7.
#
# NOTE ON HOST PORTS: 5432 and 6379 are already occupied on this machine by unrelated projects
# (careeros-postgres, specproof-redis), so NEXUS publishes on 127.0.0.1:5433 -> 5432 and
# 127.0.0.1:6380 -> 6379. Override with NEXUS_PG_HOST_PORT / NEXUS_REDIS_HOST_PORT.
# Inside the compose network the services are still postgres:5432 / redis:6379.
# NOTE ON CONTAINER NAMES: this project's compose `name:` is `nexus`, and the Postgres container is
# `nexus-platform-postgres`. It used to be `nexus-postgres` — a name another project on this machine
# (D:\内容创作平台) had already taken, with its own volume and its own unrelated `nexus` database — so
# `docker compose up postgres` failed on a name conflict for the whole build. Do not reuse that name.

# The compose PROJECT name is part of the identity Docker uses to decide which containers a
# `docker compose` invocation owns. It used to be `nexus`, which is *also* the project name an unrelated
# stack on this machine declares (D:\内容创作平台\infra\docker-compose.yml) — so `up` in either directory
# recreated the other project's containers. `nexus-platform` is unique; the container names below are too.
name: nexus-platform

services:
  # ------------------------------------------------------------------ data stores
  postgres:
    image: pgvector/pgvector:pg16            # PG16 + pgvector/pg_trgm/pgcrypto/btree_gist/citext
    # NOT `nexus-postgres`: another project on this machine (D:\内容创作平台) already owns that container
    # name and its volume, so `docker compose up` failed here for the whole build. See docs/DECISIONS.md D22.
    container_name: nexus-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXUS_DB_NAME:-nexus}
      POSTGRES_USER: postgres
      # Local-dev-only superuser password; real deployments inject this from a secret store (DECISIONS D6, §131).
      POSTGRES_PASSWORD: ${NEXUS_DB_ROOT_PASSWORD:-postgres}
      # Consumed by /docker-entrypoint-initdb.d/00_roles.sql (psql \getenv) on FIRST init of the volume only.
      NEXUS_DB_APP_PASSWORD: ${NEXUS_DB_APP_PASSWORD:-nexus_dev_app_only}
      NEXUS_DB_AI_PASSWORD: ${NEXUS_DB_AI_PASSWORD:-nexus_dev_ai_only}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Hong_Kong                      # AGENT_CONTRACT §12
    ports:
      - "127.0.0.1:${NEXUS_PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # roles + extensions, first boot only
      - ./db/migrations:/migrations:ro                   # so `make db-migrate` can psql -f inside the box
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${NEXUS_DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    # `nexus-redis` is claimed by the same foreign compose project as `nexus-postgres` (see the header note).
    container_name: nexus-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: Asia/Hong_Kong
    ports:
      - "127.0.0.1:${NEXUS_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------ app services (profile: full)
  platform:
    image: nexus/platform:dev
    container_name: nexus-platform
    profiles: ["full"]
    build:
      context: ../services/platform           # requires services/platform/Dockerfile
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${NEXUS_SPRING_PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${NEXUS_DB_NAME:-nexus}
      SPRING_DATASOURCE_USERNAME: nexus_app   # API_CONTRACT §0: read-write commerce role
      SPRING_DATASOURCE_PASSWORD: ${NEXUS_DB_APP_PASSWORD:-nexus_dev_app_only}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${NEXUS_DB_NAME:-nexus}
      # Migration credential != runtime credential. `nexus_app` has DML only (00_roles.sql), so Flyway
      # running as it cannot ALTER a table: V4__tenant_scoped_identity failed the boot with
      # `42501 must be owner of table user_identities`. Views happened to be migratable by the app role
      # only because db_apply_migrations.sh transfers view ownership. The runtime role below is unchanged.
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: ${NEXUS_DB_ROOT_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-}
      NEXUS_DEFAULT_TENANT: ${NEXUS_DEFAULT_TENANT:-hong-kong}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:3000}
      # The internal door the AI persists merchant-agent dialogue through. Shared secret read in
      # constant time by AiServiceTokenGuard; must match the AI service's own NEXUS_AI_INTERNAL_TOKEN.
      NEXUS_AI_INTERNAL_TOKEN: ${NEXUS_AI_INTERNAL_TOKEN:-dev_nexus_internal_token_for_local_compose_0123456789abcdef}
    ports:
      - "127.0.0.1:${NEXUS_PLATFORM_HOST_PORT:-8080}:8080"

  ai:
    image: nexus/ai:dev
    container_name: nexus-ai
    profiles: ["full"]
    build:
      context: ../apps/ai                     # requires apps/ai/Dockerfile
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      NEXUS_AI_PORT: "8000"
      # API_CONTRACT §0: SELECT on commerce reads, RW only on RAG/eval/agent tables. No LLM -> DB path (D3/§52).
      NEXUS_DB_URL: postgresql://nexus_ai:${NEXUS_DB_AI_PASSWORD:-nexus_dev_ai_only}@postgres:5432/${NEXUS_DB_NAME:-nexus}
      NEXUS_DB_SCHEMA_SCRIPTS: /migrations
      NEXUS_REDIS_URL: redis://redis:6379/0
      NEXUS_LLM_PROVIDER: ${NEXUS_LLM_PROVIDER:-mock}   # D4: mock keeps the whole product offline
      NEXUS_LLM_BASE_URL: ${NEXUS_LLM_BASE_URL:-}
      NEXUS_LLM_API_KEY: ${NEXUS_LLM_API_KEY:-}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-}
      NEXUS_DEFAULT_TENANT: ${NEXUS_DEFAULT_TENANT:-hong-kong}
      NEXUS_PLATFORM_BASE_URL: http://platform:8080
      # Same shared secret as the platform's door — "configured for both sides or it behaves 501".
      NEXUS_AI_INTERNAL_TOKEN: ${NEXUS_AI_INTERNAL_TOKEN:-dev_nexus_internal_token_for_local_compose_0123456789abcdef}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:3000}
      TZ: Asia/Hong_Kong
    ports:
      - "127.0.0.1:${NEXUS_AI_HOST_PORT:-8000}:8000"
    volumes:
      - ./db/migrations:/migrations:ro        # read-only: eval fixtures/SQL snippets for the AI service

  web:
    image: nexus/web:dev
    container_name: nexus-web
    profiles: ["full"]
    build:
      context: ../apps/web                    # requires apps/web/Dockerfile
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [platform, ai]
    environment:
      NEXT_PUBLIC_PLATFORM_URL: ${NEXT_PUBLIC_PLATFORM_URL:-http://localhost:8080}
      NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL:-http://localhost:8000}
      PLATFORM_INTERNAL_URL: http://platform:8080
      AI_INTERNAL_URL: http://ai:8000
      NEXUS_DEFAULT_TENANT: ${NEXUS_DEFAULT_TENANT:-hong-kong}
    ports:
      - "127.0.0.1:${NEXUS_WEB_HOST_PORT:-3000}:3000"

  # ------------------------------------------------------------------ cloud plane (opt-in: --profile cloud)
  # Spring Cloud sidecars for the edge, built from services/cloud with one Dockerfile. They are NOT
  # in `full`: the monolith serves :8080 correctly without them. The plane's wiring is proven without
  # Docker by scripts/cloud_smoke.sh; this profile is the deployment path, and it has not been
  # exercised by the smoke script (Docker image build is a separate, unclaimed step).
  eureka:
    image: nexus/eureka:dev
    container_name: nexus-eureka
    profiles: ["cloud"]
    build:
      context: ../services/cloud
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    restart: unless-stopped
    environment:
      NEXUS_EUREKA_PORT: 8761
    ports:
      - "127.0.0.1:${NEXUS_EUREKA_HOST_PORT:-18761}:8761"

  config-server:
    image: nexus/config:dev
    container_name: nexus-config
    profiles: ["cloud"]
    build:
      context: ../services/cloud
      dockerfile: Dockerfile
      args:
        MODULE: config-server
    restart: unless-stopped
    environment:
      NEXUS_CONFIG_PORT: 8888
    ports:
      - "127.0.0.1:${NEXUS_CONFIG_HOST_PORT:-18888}:8888"

  gateway:
    image: nexus/gateway:dev
    container_name: nexus-gateway
    profiles: ["cloud"]
    build:
      context: ../services/cloud
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    restart: unless-stopped
    depends_on: [eureka, config-server]
    environment:
      NEXUS_GATEWAY_PORT: 8088
      NEXUS_EUREKA_URI: http://eureka:8761/eureka/
      NEXUS_CONFIG_URI: http://config-server:8888
      # Defaults match the `full` profile's published ports; override when the platform/AI/web run
      # on the host dev ports instead (8090/8010/3000).
      NEXUS_PLATFORM_URI: ${NEXUS_CLOUD_PLATFORM_URI:-http://host.docker.internal:8080}
      NEXUS_AI_URI: ${NEXUS_CLOUD_AI_URI:-http://host.docker.internal:8000}
      NEXUS_WEB_URI: ${NEXUS_CLOUD_WEB_URI:-http://host.docker.internal:3000}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:3000}
      TZ: Asia/Hong_Kong
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${NEXUS_GATEWAY_HOST_PORT:-18088}:8088"

  # D859: Spring Boot Admin — the plane's one window. Every Eureka-registered service
  # (gateway + platform/AI under opt-in) is shown live with health, metrics and loggers.
  admin-server:
    image: nexus/admin:dev
    container_name: nexus-admin
    profiles: ["cloud"]
    build:
      context: ../services/cloud
      dockerfile: Dockerfile
      args:
        MODULE: admin-server
    restart: unless-stopped
    depends_on: [eureka, gateway]
    environment:
      NEXUS_ADMIN_PORT: 8080
      NEXUS_EUREKA_URI: http://eureka:8761/eureka/
      NEXUS_ADMIN_REGISTER: "false"
      TZ: Asia/Hong_Kong
    ports:
      - "127.0.0.1:${NEXUS_ADMIN_HOST_PORT:-19444}:8080"

  # D885: the plane's first independent service. It joins the registry, calls the monolith and AI
  # by name through OpenFeign + Spring Cloud LoadBalancer, and reports `unavailable` when a name
  # has no instance instead of faking health. It owns no database and writes nothing.
  insight-service:
    image: nexus/insight:dev
    container_name: nexus-insight
    profiles: ["cloud"]
    build:
      context: ../services/cloud
      dockerfile: Dockerfile
      args:
        MODULE: insight-service
    restart: unless-stopped
    depends_on: [eureka]
    environment:
      NEXUS_INSIGHT_PORT: 8080
      NEXUS_EUREKA_URI: http://eureka:8761/eureka/
      TZ: Asia/Hong_Kong
    ports:
      - "127.0.0.1:${NEXUS_INSIGHT_HOST_PORT:-19555}:8080"

volumes:
  pgdata:
    name: nexus_pgdata
  redisdata:
    name: nexus_redisdata
